{% extends 'base.html' %}
{% block content %}
<h2>{% if object %}Редактировать{% else %}Создать{% endif %} объявление</h2>
<form method="post">
    {% csrf_token %}
    {{ form.media }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'ad_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
