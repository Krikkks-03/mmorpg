<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MMORPG Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'ad_list' %}">MMORPG Board</a>
            <div class="ms-auto">
                {% if user.is_authenticated %}
                    <span class="text-white me-2">{{ user.email }}</span>
                    <a href="{% url 'ad_create' %}" class="btn btn-sm btn-outline-light me-2">Создать объявление</a>
                    <a href="{% url 'my_responses' %}" class="btn btn-sm btn-outline-info me-2">Мои отклики</a>
                    <a href="{% url 'account_logout' %}" class="btn btn-sm btn-outline-danger">Выйти</a>
                {% else %}
                    <a href="{% url 'account_login' %}" class="btn btn-sm btn-outline-light me-2">Войти</a>
                    <a href="{% url 'account_signup' %}" class="btn btn-sm btn-outline-success">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
